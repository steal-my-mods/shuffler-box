org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft / loader
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.248
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Mappings
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Mod metadata
mod_id=shufflerbox
mod_name=Shuffler Box
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.shufflerbox
mod_authors=Steal-My-Mods
mod_description=A shulker box that builds for you. Fill it with a palette of blocks, hold it in your off hand, and every block you place is drawn at random from the box -- weighted by how many slots you gave each block.

# Publishing. The project id is off the CurseForge project page; the token is a CurseForge API
# key held in the repo's Actions secrets as CURSEFORGE_TOKEN. Only `publishMods` reads any of
# this; an ordinary build ignores it.
curseforge_project_id=1662378
# Modrinth is not a destination yet (CLAUDE.md, Distribution). Reserve the project and slug
# there when you want it, then follow the checklist in that note -- re-adding the block alone
# is the obvious mistake.
# modrinth_project_id=
github_repository=steal-my-mods/shuffler-box
